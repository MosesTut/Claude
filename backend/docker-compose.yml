version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: timbuktoo-db
    environment:
      POSTGRES_USER: timbuktoo
      POSTGRES_PASSWORD: timbuktoo_dev_password
      POSTGRES_DB: timbuktoo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timbuktoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  api:
    build: .
    container_name: timbuktoo-api
    environment:
      DATABASE_URL: postgresql://timbuktoo:timbuktoo_dev_password@db:5432/timbuktoo
      SECRET_KEY: dev-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_DAYS: 30
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: "True"
      CORS_ORIGINS: http://localhost:19006,exp://localhost:19000
      FREE_TIER_ITINERARY_LIMIT: 3
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    restart: unless-stopped

volumes:
  postgres_data:
